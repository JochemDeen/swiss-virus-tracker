# A compact dashboard card.
type: conditional
conditions:
  - entity: media_player.lg_webos_tv_oled65cx6la
    state_not: 'off'
card:
  type: custom:mini-media-player
  entity: media_player.lg_webos_tv_oled65cx6la
  group: true
  hide:
    controls: true
    volume: true

# More elaborate card
type: vertical-stack
cards:
  - type: markdown
    content: >-
      ## Flu in Switzerland

      **{{ states('sensor.flu_switzerland_stage') }}** — {{
      states('sensor.flu_switzerland_activity') }} consultations per 100'000 ({{
      state_attr('sensor.flu_switzerland_activity', 'trend') }}), {{
      state_attr('sensor.flu_switzerland_activity', 'pct_of_epidemic_threshold')
      }}% of the epidemic threshold.

      {{ state_attr('sensor.flu_switzerland_activity', 'confirmed_cases') |
      int(0) }} confirmed cases in week {{
      state_attr('sensor.flu_switzerland_activity', 'week') }}; {{
      state_attr('sensor.flu_switzerland_activity', 'season_confirmed_cases') |
      int(0) }} so far this season.
  - type: entities
    entities:
      - entity: sensor.flu_switzerland_activity
        name: Consultations per 100k
      - entity: sensor.flu_switzerland_confirmed_cases
        name: Confirmed cases this week
      - entity: sensor.flu_switzerland_positivity
        name: Swabs positive for flu
      - entity: binary_sensor.swiss_flu_epidemic
        name: Above epidemic threshold
  - type: history-graph
    hours_to_show: 4320
    entities:
      - sensor.flu_switzerland_activity
