# A compact dashboard card. Add via the raw configuration editor.

type: vertical-stack
cards:
  - type: markdown
    content: >-
      ## Flu in Switzerland

      **{{ states('sensor.flu_switzerland_stage') }}** —
      {{ states('sensor.flu_switzerland_activity') }} consultations per 100'000
      ({{ state_attr('sensor.flu_switzerland_activity', 'trend') }}),
      {{ state_attr('sensor.flu_switzerland_activity', 'pct_of_epidemic_threshold') }}%
      of the epidemic threshold.

      {{ state_attr('sensor.flu_switzerland_activity', 'confirmed_cases') | int }} confirmed
      cases in week {{ state_attr('sensor.flu_switzerland_activity', 'week') }};
      {{ state_attr('sensor.flu_switzerland_activity', 'season_confirmed_cases') | int }}
      so far this season.

  - type: entities
    entities:
      - entity: sensor.flu_switzerland_activity
        name: Consultations per 100k
      - entity: sensor.flu_switzerland_confirmed_cases
        name: Confirmed cases this week
      - entity: sensor.flu_switzerland_positivity
        name: Swabs positive for flu
      - entity: binary_sensor.flu_ch_epidemic
        name: Above epidemic threshold

  - type: history-graph
    hours_to_show: 4320      # ~6 months
    entities:
      - sensor.flu_switzerland_activity
