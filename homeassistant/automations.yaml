# Optional: notify when Switzerland crosses into (or out of) an epidemic, and
# whenever the stage changes. Merge into your existing automations.

- alias: "Flu CH — epidemic declared"
  id: flu_ch_epidemic_declared
  triggers:
    - trigger: state
      entity_id: binary_sensor.flu_ch_epidemic
      from: "off"
      to: "on"
  actions:
    - action: notify.notify
      data:
        title: "Flu epidemic in Switzerland"
        message: >-
          {{ state_attr('sensor.flu_switzerland_activity', 'week') }}:
          {{ states('sensor.flu_switzerland_activity') }} consultations per 100k
          — above the epidemic threshold of 68.

- alias: "Flu CH — stage changed"
  id: flu_ch_stage_changed
  triggers:
    - trigger: state
      entity_id: sensor.flu_switzerland_stage
  conditions:
    - condition: template
      value_template: "{{ trigger.from_state.state not in ['unknown', 'unavailable', None] }}"
    - condition: template
      value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
  actions:
    - action: notify.notify
      data:
        title: "Swiss flu level: {{ trigger.to_state.state }}"
        message: >-
          Was {{ trigger.from_state.state }}.
          {{ state_attr('sensor.flu_switzerland_activity', 'stage_description') }}
          ({{ states('sensor.flu_switzerland_activity') }} per 100k,
          {{ state_attr('sensor.flu_switzerland_activity', 'trend') }})
