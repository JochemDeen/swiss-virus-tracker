# Swiss flu tracker -> Home Assistant
#
# Paste this into configuration.yaml (or a package under packages/), replacing
# the resource URL with wherever you publish site/current.json — e.g.
#   https://<your-github-user>.github.io/flu-tracker/current.json
#
# current.json is small (well under 1 kB) and only changes on Wednesdays, so a
# 3-hourly poll is plenty.

rest:
  - resource: https://YOUR-USERNAME.github.io/flu-tracker/current.json
    scan_interval: 10800          # 3 hours
    sensor:
      - name: "Flu Switzerland activity"
        unique_id: flu_ch_ili_incidence
        value_template: "{{ value_json.ili_incidence }}"
        unit_of_measurement: "per 100k"
        state_class: measurement
        icon: mdi:virus
        json_attributes_path: "$"
        json_attributes:
          - week
          - week_start
          - season
          - stage
          - stage_key
          - stage_level
          - stage_description
          - trend
          - epidemic
          - pct_of_epidemic_threshold
          - confirmed_cases
          - confirmed_cases_trend
          - pct_positive
          - season_confirmed_cases

      - name: "Flu Switzerland stage"
        unique_id: flu_ch_stage
        value_template: "{{ value_json.stage }}"
        icon: >-
          {% set k = value_json.stage_key %}
          {% if k in ['high', 'very_high'] %} mdi:alert-octagon
          {% elif k == 'epidemic' %} mdi:alert
          {% else %} mdi:check-circle-outline {% endif %}

      - name: "Flu Switzerland confirmed cases"
        unique_id: flu_ch_confirmed_cases
        value_template: "{{ value_json.confirmed_cases | int(0) }}"
        unit_of_measurement: "cases/week"
        state_class: measurement
        icon: mdi:test-tube

      - name: "Flu Switzerland positivity"
        unique_id: flu_ch_positivity
        value_template: "{{ value_json.pct_positive }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:percent-outline

binary_sensor:
  - platform: template
    sensors:
      flu_ch_epidemic:
        friendly_name: "Swiss flu epidemic"
        unique_id: flu_ch_epidemic
        device_class: safety
        value_template: >-
          {{ state_attr('sensor.flu_switzerland_activity', 'epidemic') | bool(false) }}
